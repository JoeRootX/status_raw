# Rutina del horario laboral: dispara /api/rutina en los slots de Jalisco.
#
# El cron de GitHub corre en UTC y es de baja precisión (puede atrasarse unos
# minutos): no pasa nada porque el slot se reclama por hora en Redis y el
# endpoint valida la hora local de Jalisco. El fin de semana el endpoint
# ignora los disparos (null = "fuera de horario").
#
# El secreto es el mismo RUTINA_SECRETO que ya es Secret en Vercel.

name: rutina

on:
  schedule:
    # UTC: 15,17,19,21,23,1,3 = 9,11,13,15,17,19,21 de Jalisco (offset fijo UTC-6)
    - cron: '0 15,17,19,21,23,1,3 * * *'
  workflow_dispatch: # para probar a mano: gh workflow run rutina

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Golpear /api/rutina
        env:
          RUTINA_SECRETO: ${{ secrets.RUTINA_SECRETO }}
        run: |
          curl -sS --max-time 30 -X POST https://status-raw.vercel.app/api/rutina \
            -H "Authorization: Bearer $RUTINA_SECRETO" \
            -w '\nHTTP:%{http_code}\n'
